<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="/favicon.ico" type="image/x-icon">
        <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="../dist/css/index.css">
        <script defer type="module" src="../js/index.mjs"></script>
        <title>Profile | ConnectSphere</title>
    </head>

    <body>
        <header class="fixed-top">
            <nav class="navbar navbar-expand-lg bg-primary z-3" data-bs-theme="dark">
                <div class="container-fluid profile-container">
                    <a class="navbar-brand navbar-brand-custom" href="../feed/index.html">
                        <img src="../images/ConnectSphere logo.png" alt="Logo" width="64" height="64"
                            class="d-inline-block align-text-center">ConnectSphere
                    </a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                        data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                        aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarSupportedContent">
                        <ul class="navbar-nav justify-content-center mx-auto my-5 gap-3 my-lg-0">
                            <li class="nav-item px-lg-2">
                                <a class="nav-link active" aria-current="page" href="index.html">Profile</a>
                            </li>
                            <li class="nav-item px-lg-2">
                                <a class="nav-link" href="../feed/index.html">Feed</a>
                            </li>
                            <li class="nav-item px-lg-2">
                                <a class="nav-link logout" href="#">Logout</a>
                            </li>
                        </ul>
                        <div class="d-flex align-items-center">
                            <form class="search-form d-flex align-items-center">
                                <input class="form-control me-2 bg-light custom-search" type="search"
                                    placeholder="Search" aria-label="Search">
                                <button class="btn btn-secondary me-2" type="submit">Search</button>
                            </form>
                            <div class="dropdown ms-3">
                                <button class="btn btn-secondary dropdown-toggle" type="button" id="filterDropdown"
                                    data-bs-toggle="dropdown" aria-expanded="false">
                                    Filter by
                                </button>
                                <ul class="dropdown-menu" aria-labelledby="filterDropdown">
                                    <li><a class="dropdown-item" href="#" data-tag="">No Filter</a></li>
                                    <li><a class="dropdown-item" href="#" data-tag="dog,dogs,puppies,puppy,pug">Dogs</a>
                                    </li>
                                    <li><a class="dropdown-item" href="#" data-tag="cat,cats,meow">Cats</a></li>
                                    <li><a class="dropdown-item" href="#"
                                            data-tag="nature,river,mountain,mountains,forest,landscape,lake,sunset,sunrise">Nature</a>
                                    </li>
                                    <li><a class="dropdown-item" href="#"
                                            data-tag="food,fish,meat,cook,cooking">Food</a></li>
                                    <li><a class="dropdown-item" href="#"
                                            data-tag="travel,vacation,fly,flying">Travel</a></li>
                                    <li><a class="dropdown-item" href="#" data-tag="yoga">Yoga</a></li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </nav>
        </header>
        <main>
            <div id="loader-container" class="justify-content-center align-items-center">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
            <div class="container-fluid d-flex flex-column feed-container">
                <h1 class="visually-hidden">Profile</h1>
                <button type="button" id="openPostModalButton" class="btn btn-primary mb-3 btn-custom">
                    Create New Post
                </button>
                <div class="row justify-content-center row-gap-3">
                    <section class="col-lg-8 profile-section">
                        <div class="card bg-white rounded-3 flex-grow-1 flex-sm-grow-0 card-custom profile-card">
                            <div class="card-body d-flex flex-column p-0">
                                <div class="card-header p-0">
                                    <div id="profile-cover">
                                        <!-- Dynamic Cover Picture -->
                                    </div>
                                    <div id="profile-image">
                                        <!-- Dynamic Profile Picture -->
                                    </div>
                                    <div id="profile-picture-edit-button">
                                        <button type="button" name="edit-profile" title="Edit Profile Picture"
                                            class="btn border rounded-circle d-flex justify-content-center"><i
                                                class="bi bi-pen"></i></button>
                                    </div>
                                    <div id="profile-cover-edit-button">
                                        <button type="button" title="Edit Cover Picture" name="edit-cover"
                                            class="btn border rounded-circle d-flex justify-content-center"><i
                                                class="bi bi-camera"></i></button>
                                    </div>
                                </div>
                                <div class="card-main">
                                    <div class="d-flex flex-row justify-content-between align-items-baseline">
                                        <div id="profile-id">
                                            <!-- Dynamic Username -->
                                        </div>
                                        <div class="follow">
                                            <input type="checkbox" class="btn-check" id="btn-check" autocomplete="off">
                                            <label class="btn btn-primary btn-sm btn-custom px-4"
                                                for="btn-check">Follow</label>
                                        </div>
                                    </div>
                                    <div id="profile-bio">
                                        <!-- Dynamic Bio -->
                                    </div>
                                </div>
                            </div>
                            <div class="card-footer d-flex flex-wrap pt-3 justify-content-between">
                                <div class="flex-fill following-counter">
                                    <!-- Dynamic Counter -->>
                                </div>
                                <div class="flex-fill followers-counter">
                                    <!-- Dynamic Counter -->>
                                </div>
                                <div class="flex-fill posts-counter">
                                    <!-- Dynamic Counter -->>
                                </div>
                            </div>
                        </div>
                    </section>
                    <section class="col-lg-4 follow-section">
                        <div
                            class="card card-custom card-follow bg-white rounded-3 flex-grow-1 flex-sm-grow-0 follow-card mb-3 following">
                            <div class="card-body">
                                <h3 class="h3 card-title">Following</h3>
                                <ul class="list-group list-group-flush">
                                    <!-- Dynamic Following List -->
                                </ul>
                            </div>
                        </div>
                        <div
                            class="card card-custom card-follow bg-white rounded-3 flex-grow-1 flex-sm-grow-0 follow-card mb-3 followers">
                            <div class="card-body">
                                <h3 class="h3 card-title">Followers</h3>
                                <ul class="list-group list-group-flush">
                                    <!-- Dynamic Followers List -->
                                </ul>
                            </div>
                        </div>
                    </section>
                    <section class="row mt-xl-5 feed-profile">
                        <div class="d-flex flex-column row-gap-5" id="feed-container">
                            <!-- Feed list fetched from API and rendered -->
                        </div>
                    </section>
                </div>
            </div>
        </main>
        <footer class="fixed-bottom">
            <div class="container-fluid bg-primary">
                <p class="text-light mt-3 text-wrap">© 2025 ConnectSphere. All rights reserved.</p>
            </div>
        </footer>
        <div id="modals-container"></div>
    </body>

</html>
